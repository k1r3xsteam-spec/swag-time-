name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android scaffolding
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name=swag_time --org=com.swagtime
          flutter pub get

      - name: Patch AndroidManifest
        working-directory: app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          sed -i 's|</manifest>|    <queries>\n        <package android:name="org.telegram.messenger" />\n        <package android:name="org.telegram.messenger.web" />\n        <package android:name="org.telegram.plus" />\n        <package android:name="org.thunderdog.challegram" />\n    </queries>\n</manifest>|' $MANIFEST
          cat $MANIFEST

      - name: Generate Launcher Icons
        working-directory: app
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swag-time-apk
          path: app/build/app/outputs/flutter-apk/*.apk