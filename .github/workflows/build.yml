name: Build APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android scaffolding
        working-directory: app
        run: |
          flutter create . --platforms=android --project-name=swag_time --org=com.swagtime
          flutter pub get

      - name: Patch AndroidManifest
        working-directory: app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PYEOF'
import re
path = "android/app/src/main/AndroidManifest.xml"
with open(path, "r", encoding="utf-8") as f:
    xml = f.read()

# INTERNET permission перед <application>
if 'android.permission.INTERNET' not in xml:
    xml = re.sub(
        r'<application',
        '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
        xml, count=1)

# <queries> перед </manifest>
if '<queries>' not in xml:
    queries = '''    <queries>
        <package android:name="org.telegram.messenger" />
        <package android:name="org.telegram.messenger.web" />
        <package android:name="org.telegram.plus" />
        <package android:name="org.thunderdog.challegram" />
        <intent>
            <action android:name="android.intent.action.VIEW" />
            <data android:scheme="tg" />
        </intent>
        <intent>
            <action android:name="android.intent.action.VIEW" />
            <data android:scheme="https" />
        </intent>
    </queries>
</manifest>'''
    xml = xml.replace('</manifest>', queries, 1)

with open(path, "w", encoding="utf-8") as f:
    f.write(xml)

print(xml)
PYEOF

      - name: Generate Launcher Icons
        working-directory: app
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swag-time-apk
          path: app/build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false